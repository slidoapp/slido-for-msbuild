name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

      - name: Restore
        run: |
          dotnet restore .\slido-for-msbuild.sln

      - name: Test
        run: |
          dotnet test .\slido-for-msbuild.sln -c Release --verbosity quiet
